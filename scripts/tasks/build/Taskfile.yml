version: 3

tasks:
  bin:
    desc: "Build CLI binary"
    deps: [":base:clear"]
    sources:
      - ./cmd/**
      - ./internal/**
      - ./pkg/**
      - ./.git/**
      - ./go.mod
      - ./go.sum
      - ./Taskfile.yml
      - ./scripts/tasks/**
    generates:
      - ./data/cli/cli
    cmds:
      - |
        go build -ldflags "-s -w \
          -X 'github.com/117503445/sys-image-builder/internal/buildinfo.GitCommit=$(git rev-parse HEAD 2>/dev/null || echo unknown)' \
          -X 'github.com/117503445/sys-image-builder/internal/buildinfo.GitBranch=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo unknown)' \
          -X 'github.com/117503445/sys-image-builder/internal/buildinfo.GitTag=$(git describe --tags --abbrev=0 2>/dev/null || echo unknown)' \
          -X 'github.com/117503445/sys-image-builder/internal/buildinfo.GitDirty=$(git status --porcelain 2>/dev/null | grep -q . && echo dirty || echo clean)' \
          -X 'github.com/117503445/sys-image-builder/internal/buildinfo.GitVersion=$(git describe --tags --always --dirty 2>/dev/null || echo unknown)' \
          -X 'github.com/117503445/sys-image-builder/internal/buildinfo.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)' \
          -X 'github.com/117503445/sys-image-builder/internal/buildinfo.BuildDir=$(pwd)'" \
          -o ./data/cli/cli ./cmd/cli
